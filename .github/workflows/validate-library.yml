name: Validate skill library

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "23 13 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skill and ontology validation
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24

      - name: Validate skills and self-ontology
        run: node scripts/validate-library.mjs

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Scan repository history for secrets
        uses: docker://ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
        with:
          args: detect --source=/github/workspace --redact --no-banner --exit-code=1
